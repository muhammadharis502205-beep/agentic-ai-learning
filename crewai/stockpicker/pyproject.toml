[project]
name = "stockpicker"
version = "0.1.0"
description = "stockPicker using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.16,<2.0.0"
]

[project.scripts]
stockpicker = "stockpicker.main:run"
run_crew = "stockpicker.main:run"
train = "stockpicker.main:train"
replay = "stockpicker.main:replay"
test = "stockpicker.main:test"
run_with_trigger = "stockpicker.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "b1a020f3-291a-4e29-9e82-efba8d5905a7"
